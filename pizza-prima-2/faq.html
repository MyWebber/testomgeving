<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veelgestelde vragen — Pizza Prima 2</title>
<meta name="description" content="Antwoorden op veelgestelde vragen over bezorging, betalen, allergenen, openingstijden en afhalen bij Pizza Prima 2.">
<link rel="canonical" href="https://www.pizzaprima2.nl/faq.html">
<meta name="theme-color" content="#C6351F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🍕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> <span>/</span> <span>FAQ</span></div>
      <span class="eyebrow"><span class="dot"></span> Hulp nodig?</span>
      <h1 class="section-title">Veelgestelde <em>vragen</em></h1>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:760px;">
      <div id="faqTabs" class="filters-bar" style="justify-content:center;position:static;"></div>
      <div id="faqList"></div>

      <div class="reveal" style="text-align:center;margin-top:48px;padding:36px;background:var(--paper);border:1px solid var(--border-soft);border-radius:var(--radius-lg);">
        <h3 class="font-display" style="margin-bottom:8px;">Staat je vraag er niet bij?</h3>
        <p class="text-muted" style="margin-bottom:18px;">Ons team helpt je graag verder.</p>
        <a href="contact.html" class="btn btn-primary">Neem contact op</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/app.js"></script>
<script>
  PP2.init({ active: "" });

  const cats = ["Alles", ...new Set(FAQS.map(f => f.cat))];
  let active = "Alles";

  function render() {
    document.getElementById("faqTabs").innerHTML = cats.map(c =>
      `<button class="chip-filter ${c === active ? "active" : ""}" data-cat="${c}">${c}</button>`
    ).join("");
    document.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => { active = btn.dataset.cat; render(); }));

    const list = FAQS.filter(f => active === "Alles" || f.cat === active);
    document.getElementById("faqList").innerHTML = list.map((f, i) => `
      <div class="accordion-item reveal ${i === 0 ? "" : ""}">
        <button class="accordion-trigger">
          <span>${f.q}</span>
          <span class="plus">+</span>
        </button>
        <div class="accordion-panel"><div class="accordion-panel-inner">${f.a}</div></div>
      </div>`).join("");
    PP2.wireAccordions();
    PP2.wireReveal();
  }
  render();
</script>
</body>
</html>
